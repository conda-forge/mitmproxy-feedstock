schema_version: 1

context:
  version: 12.3.1
  python_min: '3.12'

package:
  name: mitmproxy
  version: ${{ version }}

source:
  url: https://github.com/mitmproxy/mitmproxy/archive/v${{ version }}.tar.gz
  sha256: 699d61561cf20f374fd654a30afc0e82af609976b1f589c42e1809210eb6f89b

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation .
  python:
    # if ommitted, the windows tests fail
    entry_points:
      - mitmproxy = mitmproxy.tools.main:mitmproxy
      - mitmdump = mitmproxy.tools.main:mitmdump
      - mitmweb = mitmproxy.tools.main:mitmweb

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aioquic >=1.2.0,<=1.2.0
    - argon2-cffi >=23.1.0,<=25.1.0
    - asgiref >=3.2.10,<=3.12.1
    - bcrypt >=5.0.0,<=5.0.0
    - certifi >=2026.10.19
    - cryptography >=42.0,<=50.0.2
    - flask >=3.0,<=3.1.3
    - h11 >=0.16.0,<=0.16.0
    - h2 >=4.3.0,<=4.4.1
    - hyperframe >=6.0,<=6.1.0
    - kaitaistruct >=0.10,<=0.11
    - ldap3 >=2.8,<=2.9.1
    - mitmproxy-rs >=0.12.15,<0.13
    - if: win
      then:
        - __win
        - pydivert >=2.0.3,<=2.1.0
    - if: unix
      then:
        - __unix
    - pyopenssl >=24.3,<=27.0.0
    - pyparsing >=3.3.2,<=3.3.3
    - pyperclip >=1.9.0,<=1.11.0
    - ruamel.yaml >=0.18.10,<=0.19.1
    - sortedcontainers >=2.3,<=2.4.0
    - tornado >=6.5.0,<=6.5.10
    - urwid >=2.6.14,<=4.0.13
    - wsproto >=1.0,<=1.3.2
    - publicsuffix2 >=2.20190812,<=2.20191221
    - typing_extensions >=4.13.2,<=4.16.0
    - pydivert >=2.0.3,<=3.1.3
    - brotli >=1.2.1,<=1.2.1
    - backports.zstd >=1.7.0,<=1.7.0
tests:
  - python:
      imports:
        - mitmproxy
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - mitmproxy --version
      - mitmdump --version
      - mitmweb --version

about:
  summary: An interactive TLS-capable intercepting HTTP proxy for penetration testers and software developers.
  license: MIT
  license_file:
    - LICENSE
  homepage: http://mitmproxy.org

extra:
  recipe-maintainers:
    - wolfv
    - AdrianFreundQC
    - freundTech
    - moritzwilksch
    - ytausch
